# ros_gz_bridge YAML configuration for linorobot2
# This explicitly maps Gazebo Transport topics to ROS 2 topics.
# Gazebo Harmonic scopes relative plugin topics under /model/<entity_name>/

- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS

# DiffDrive controller topics
- ros_topic_name: "/cmd_vel"
  gz_topic_name: "/model/linorobot2/cmd_vel"
  ros_type_name: "geometry_msgs/msg/Twist"
  gz_type_name: "gz.msgs.Twist"
  direction: BIDIRECTIONAL

- ros_topic_name: "/odom/unfiltered"
  gz_topic_name: "/model/linorobot2/odom/unfiltered"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS

# IMU sensor
- ros_topic_name: "/imu/data"
  gz_topic_name: "/model/linorobot2/imu/data"
  ros_type_name: "sensor_msgs/msg/Imu"
  gz_type_name: "gz.msgs.IMU"
  direction: GZ_TO_ROS

# Joint states (custom topic name from plugin)
- ros_topic_name: "/joint_states"
  gz_topic_name: "/model/linorobot2/joint_states"
  ros_type_name: "sensor_msgs/msg/JointState"
  gz_type_name: "gz.msgs.Model"
  direction: GZ_TO_ROS

# Joint states (default Gazebo topic - world scoped)
- ros_topic_name: "/joint_states"
  gz_topic_name: "/world/house/model/linorobot2/joint_state"
  ros_type_name: "sensor_msgs/msg/JointState"
  gz_type_name: "gz.msgs.Model"
  direction: GZ_TO_ROS

# LiDAR
- ros_topic_name: "/scan"
  gz_topic_name: "/model/linorobot2/scan"
  ros_type_name: "sensor_msgs/msg/LaserScan"
  gz_type_name: "gz.msgs.LaserScan"
  direction: GZ_TO_ROS

# RGBD Camera
- ros_topic_name: "/camera/color/camera_info"
  gz_topic_name: "/model/linorobot2/camera/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS

- ros_topic_name: "/camera/color/image_raw"
  gz_topic_name: "/model/linorobot2/camera/image"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

- ros_topic_name: "/camera/depth/image_rect_raw"
  gz_topic_name: "/model/linorobot2/camera/depth_image"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

- ros_topic_name: "/camera/depth/color/points"
  gz_topic_name: "/model/linorobot2/camera/points"
  ros_type_name: "sensor_msgs/msg/PointCloud2"
  gz_type_name: "gz.msgs.PointCloudPacked"
  direction: GZ_TO_ROS
